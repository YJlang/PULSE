spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pulse_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:wnsgk677400}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  session:
    jdbc:
      initialize-schema: always

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://127.0.0.1:8000/api}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

# 날씨(대시보드 insights.weather) — 재난안전데이터공유플랫폼 단기예보(SKY/PTY)
# api-id/service-key 미설정 시 weather=null로 graceful 처리됨
weather:
  base-url: ${WEATHER_BASE_URL:https://www.safetydata.go.kr/V2/api}
  api-id: ${WEATHER_API_ID:}
  service-key: ${WEATHER_API_KEY:}

server:
  port: ${SERVER_PORT:8080}
